<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Anchored sidebar drag behavior</title>
  <desc id="desc">Before dragging, the pointer holds the SEO section handle. When dragging begins, sections above and below collapse toward SEO, keeping the grabbed heading aligned with the pointer.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#cbd5e1" stroke-opacity=".34"/>
    </pattern>
  </defs>

  <rect width="1200" height="680" rx="28" fill="url(#page)"/>
  <rect width="1200" height="680" rx="28" fill="url(#grid)"/>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="56" y="61" fill="#065f46" font-size="15" font-weight="700" letter-spacing="1.8">ANCHORED BEHAVIOR</text>
    <text x="56" y="101" fill="#0f172a" font-size="30" font-weight="760">The grabbed heading stays under the pointer</text>

    <g filter="url(#shadow)">
      <rect x="48" y="136" width="514" height="488" rx="22" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="638" y="136" width="514" height="488" rx="22" fill="#ffffff" stroke="#a7f3d0"/>
    </g>

    <g>
      <circle cx="79" cy="171" r="13" fill="#e2e8f0"/>
      <text x="79" y="176" text-anchor="middle" fill="#475569" font-size="13" font-weight="700">1</text>
      <text x="103" y="177" fill="#334155" font-size="16" font-weight="700">Before drag</text>
      <circle cx="669" cy="171" r="13" fill="#d1fae5"/>
      <text x="669" y="176" text-anchor="middle" fill="#065f46" font-size="13" font-weight="700">2</text>
      <text x="693" y="177" fill="#065f46" font-size="16" font-weight="700">Drag begins</text>
    </g>

    <!-- Before-drag sidebar -->
    <g>
      <rect x="103" y="207" width="402" height="366" rx="15" fill="#f8fafc" stroke="#cbd5e1"/>
      <rect x="103" y="207" width="402" height="38" rx="15" fill="#f1f5f9"/>
      <circle cx="125" cy="226" r="4" fill="#f87171"/>
      <circle cx="140" cy="226" r="4" fill="#fbbf24"/>
      <circle cx="155" cy="226" r="4" fill="#34d399"/>
      <text x="304" y="231" text-anchor="middle" fill="#64748b" font-size="12" font-weight="650">POST SETTINGS</text>

      <g fill="#ffffff" stroke="#cbd5e1">
        <rect x="119" y="261" width="370" height="90" rx="10"/>
        <rect x="119" y="361" width="370" height="74" rx="10"/>
        <rect x="119" y="445" width="370" height="106" rx="10" stroke="#2563eb" stroke-width="2"/>
      </g>
      <g fill="#0f172a" font-size="14" font-weight="700">
        <text x="139" y="288">Publish</text>
        <text x="139" y="388">Ownership</text>
        <text x="139" y="472">SEO</text>
      </g>
      <g fill="#94a3b8" font-size="11">
        <text x="139" y="313">Status, slug, publish date</text>
        <text x="139" y="413">Author and permissions</text>
        <text x="139" y="499">Title and description</text>
        <text x="139" y="521">Search visibility</text>
      </g>
      <g fill="#64748b">
        <circle cx="463" cy="278" r="2"/><circle cx="471" cy="278" r="2"/><circle cx="463" cy="284" r="2"/><circle cx="471" cy="284" r="2"/><circle cx="463" cy="290" r="2"/><circle cx="471" cy="290" r="2"/>
        <circle cx="463" cy="378" r="2"/><circle cx="471" cy="378" r="2"/><circle cx="463" cy="384" r="2"/><circle cx="471" cy="384" r="2"/><circle cx="463" cy="390" r="2"/><circle cx="471" cy="390" r="2"/>
        <circle cx="463" cy="462" r="2"/><circle cx="471" cy="462" r="2"/><circle cx="463" cy="468" r="2"/><circle cx="471" cy="468" r="2"/><circle cx="463" cy="474" r="2"/><circle cx="471" cy="474" r="2"/>
      </g>
      <path d="M 487 483 L 487 513 L 495 505 L 502 519 L 509 515 L 502 501 L 513 500 Z" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
      <rect x="344" y="525" width="125" height="22" rx="11" fill="#dbeafe"/>
      <text x="406" y="540" text-anchor="middle" fill="#1d4ed8" font-size="11" font-weight="700">Pointer on handle</text>
    </g>

    <!-- Anchored collapsed result -->
    <g>
      <rect x="693" y="207" width="402" height="366" rx="15" fill="#f8fafc" stroke="#6ee7b7"/>
      <rect x="693" y="207" width="402" height="38" rx="15" fill="#ecfdf5"/>
      <circle cx="715" cy="226" r="4" fill="#f87171"/>
      <circle cx="730" cy="226" r="4" fill="#fbbf24"/>
      <circle cx="745" cy="226" r="4" fill="#34d399"/>
      <text x="894" y="231" text-anchor="middle" fill="#64748b" font-size="12" font-weight="650">POST SETTINGS</text>

      <g fill="#ffffff" stroke="#cbd5e1">
        <rect x="709" y="315" width="370" height="48" rx="8"/>
        <rect x="709" y="369" width="370" height="48" rx="8"/>
        <rect x="709" y="423" width="370" height="48" rx="8" stroke="#2563eb" stroke-width="2"/>
        <rect x="709" y="477" width="370" height="48" rx="8"/>
      </g>
      <g fill="#0f172a" font-size="14" font-weight="700">
        <text x="729" y="345">Publish</text>
        <text x="729" y="399">Ownership</text>
        <text x="729" y="453">SEO</text>
        <text x="729" y="507">Revisions</text>
      </g>
      <g fill="#64748b">
        <circle cx="1053" cy="437" r="2"/><circle cx="1061" cy="437" r="2"/><circle cx="1053" cy="443" r="2"/><circle cx="1061" cy="443" r="2"/><circle cx="1053" cy="449" r="2"/><circle cx="1061" cy="449" r="2"/>
      </g>
      <path d="M 1077 459 L 1077 489 L 1085 481 L 1092 495 L 1099 491 L 1092 477 L 1103 476 Z" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>

      <path d="M 1087 451 C 1096 450 1100 450 1108 451" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrow-green)"/>
      <rect x="835" y="541" width="204" height="46" rx="12" fill="#d1fae5" stroke="#a7f3d0"/>
      <text x="937" y="560" text-anchor="middle" fill="#065f46" font-size="12" font-weight="750">Grabbed heading stays put</text>
      <text x="937" y="576" text-anchor="middle" fill="#047857" font-size="11">Pointer and handle remain connected</text>
    </g>

    <g fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)">
      <path d="M 780 285 C 774 301 774 315 780 327"/>
      <path d="M 806 535 C 800 519 800 505 806 493"/>
    </g>
    <text x="895" y="609" text-anchor="middle" fill="#065f46" font-size="13" font-weight="700">Sections converge around the point of manipulation.</text>
  </g>
</svg>
