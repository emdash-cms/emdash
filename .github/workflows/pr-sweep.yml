name: PR Sweep

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  sweep:
    name: Sweep Open PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Sweep PRs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const now = new Date();
            const isDesignPR = pr =>
              (pr.body || '').includes('<!-- design-pr -->') || /^design:/i.test(pr.title);
            const { fetchHumanActivity, sweepAction } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-staleness.mjs`
            );
            const markers = {
              claReminder: '<!-- cla-reminder -->',
              claClose: '<!-- cla-close -->',
              staleWarning: '<!-- stale-author-warning -->',
              staleClose: '<!-- stale-author-close -->',
            };
            const waitingFor = {
              draft: 'it is still a draft',
              'changes-requested': 'changes were requested',
              conflicts: 'it has merge conflicts with `main`',
            };
            const reopenHint =
              "When you're ready to continue, reopen it, or comment here and a Project Team member will reopen it.";

            // Label color map for auto-creation
            const labelColors = {
              'needs-approval': 'fbca04',
              'needs-rebase': 'e11d48',
              'stale': 'ededed',
            };

            // Ensure labels exist
            const existingLabels = new Set();
            for await (const response of github.paginate.iterator(
              github.rest.issues.listLabelsForRepo,
              { owner, repo, per_page: 100 }
            )) {
              for (const label of response.data) {
                existingLabels.add(label.name);
              }
            }
            for (const [name, color] of Object.entries(labelColors)) {
              if (!existingLabels.has(name)) {
                await github.rest.issues.createLabel({ owner, repo, name, color });
              }
            }

            // Get all open PRs
            const prs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            core.info(`Sweeping ${prs.length} open PRs`);
            const humanActivity = await fetchHumanActivity(github, owner, repo);

            for (const pr of prs) {
              const prLabels = new Set(pr.labels.map(l => l.name));
              const isDesign = isDesignPR(pr);
              const toAdd = [];
              const toRemove = [];

              // --- needs-approval: PR has no CI check runs ---
              // (CLA runs via pull_request_target so it always runs)
              try {
                const { data: checkRuns } = await github.rest.checks.listForRef({
                  owner,
                  repo,
                  ref: pr.head.sha,
                  per_page: 100,
                });
                // Filter to only CI-related checks (not CLA, not PR Triage)
                const ciChecks = checkRuns.check_runs.filter(c =>
                  !c.name.includes('CLA') &&
                  !c.name.includes('Label') &&
                  !c.name.includes('Triage') &&
                  !c.name.includes('Validate PR')
                );
                const prAge = now - new Date(pr.created_at);

                if (ciChecks.length === 0 && prAge > 5 * 60 * 1000) {
                  // No CI checks after 5 minutes -- likely needs approval
                  if (!prLabels.has('needs-approval')) toAdd.push('needs-approval');
                } else {
                  if (prLabels.has('needs-approval')) toRemove.push('needs-approval');
                }
              } catch {
                // Ignore check run lookup failures
              }

              // --- needs-rebase: PR has merge conflicts ---
              // mergeable is not included in the list endpoint; fetch individually
              let mergeable = null;
              try {
                const { data: fullPr } = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: pr.number,
                });
                mergeable = fullPr.mergeable;
                if (fullPr.mergeable === false) {
                  if (!prLabels.has('needs-rebase')) toAdd.push('needs-rebase');
                } else if (fullPr.mergeable === true) {
                  if (prLabels.has('needs-rebase')) toRemove.push('needs-rebase');
                }
                // mergeable===null means GitHub is still computing; skip
              } catch {
                // Ignore merge status lookup failures
              }

              // --- Stale and unsigned-CLA handling ---
              const sweepState = {
                now,
                createdAt: new Date(pr.created_at),
                isBotAuthor: pr.user?.type === 'Bot',
                isDraft: pr.draft,
                isDesign,
                labels: prLabels,
                mergeable,
                lastActivity: humanActivity.get(pr.number) ?? new Date(pr.created_at),
                claReminderAt: null,
                staleWarningAt: null,
              };
              // Without notices the decision can only become more active, so a PR
              // that needs nothing here skips the comment lookup.
              let sweep = sweepAction(sweepState);
              if (sweep.action !== 'none' || prLabels.has('stale')) {
                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner,
                  repo,
                  issue_number: pr.number,
                  per_page: 100,
                });
                const latestNotice = marker => {
                  const notice = comments
                    .filter(c => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker))
                    .at(-1);
                  return notice ? new Date(notice.created_at) : null;
                };
                sweep = sweepAction({
                  ...sweepState,
                  claReminderAt: latestNotice(markers.claReminder),
                  staleWarningAt: latestNotice(markers.staleWarning),
                });
              }

              const comment = body =>
                github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
              const close = () =>
                github.rest.pulls.update({ owner, repo, pull_number: pr.number, state: 'closed' });

              if (sweep.action === 'cla-remind') {
                await comment(`${markers.claReminder}\nThis PR can't be merged until the [Contributor License Agreement](https://www.cloudflare.com/cla/) is signed. The CLA comment above explains how to sign. If it is still unsigned 7 days after the PR was opened, the PR will be closed.`);
              } else if (sweep.action === 'cla-close') {
                await comment(`${markers.claClose}\nClosing because the Contributor License Agreement is still unsigned. Sign it using the CLA comment above, then reopen this PR, or comment here and a Project Team member will reopen it.`);
                await close();
                core.info(`#${pr.number}: closed (CLA unsigned)`);
                continue;
              } else if (sweep.action === 'stale-warn') {
                const body = isDesign
                  ? `${markers.staleWarning}\nThis design PR is waiting on its author because ${waitingFor[sweep.reason]}, and it has had no human activity for 14 days. Design PRs are not closed for inactivity. If the proposal is withdrawn, please close it.`
                  : `${markers.staleWarning}\nThis PR is waiting on its author because ${waitingFor[sweep.reason]}, and it has had no activity for 14 days. It will be closed in 7 days unless there is activity: push an update or leave a comment to keep it open.`;
                await comment(body);
              } else if (sweep.action === 'stale-close') {
                await comment(`${markers.staleClose}\nClosing after 21 days without activity while waiting on its author because ${waitingFor[sweep.reason]}. ${reopenHint}`);
                await close();
                core.info(`#${pr.number}: closed (stale, ${sweep.reason})`);
                continue;
              }

              if (sweep.stale && !prLabels.has('stale')) toAdd.push('stale');
              if (!sweep.stale && prLabels.has('stale')) toRemove.push('stale');

              // --- Apply label changes ---
              if (toAdd.length > 0) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: pr.number,
                  labels: toAdd,
                });
              }
              for (const label of toRemove) {
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: pr.number,
                    name: label,
                  });
                } catch {
                  // Label might not exist on the PR
                }
              }

              if (toAdd.length > 0 || toRemove.length > 0) {
                core.info(`#${pr.number}: +[${toAdd.join(',')}] -[${toRemove.join(',')}]`);
              }
            }
