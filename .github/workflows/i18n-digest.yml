name: i18n Digest

on:
  schedule:
    - cron: "0 7 * * FRI"
  workflow_dispatch:
    inputs:
      since:
        description: "Strings added in the last 7 days, or since the last release"
        type: choice
        options:
          - week
          - last-release
        default: week

permissions:
  contents: read

concurrency:
  group: i18n-digest
  cancel-in-progress: false

jobs:
  digest:
    name: Post new strings to Discord
    if: github.repository == 'emdash-cms/emdash'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Post digest
        run: node scripts/i18n-digest.mjs --since "$SINCE"
        env:
          SINCE: ${{ inputs.since || 'week' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_I18N }}
          DISCORD_ROLE_ID: ${{ vars.DISCORD_I18N_ROLE_ID }}
