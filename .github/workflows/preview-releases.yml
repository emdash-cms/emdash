name: Preview Releases

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "packages/**"
      - "!packages/**/test/**"
      - "!packages/**/tests/**"
      - "!packages/**/__tests__/**"
      - "!packages/admin/src/locales/*/messages.po"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - ".github/workflows/preview-releases.yml"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  publish:
    name: Publish Preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Prepare pnpm's lockfile check cache
        id: pnpm-verdict
        run: |
          echo "pnpm_config_cache_dir=$HOME/.cache/pnpm" >> "$GITHUB_ENV"
          echo "key=pnpm-verdict-$(pnpm --version)" >> "$GITHUB_OUTPUT"
      # pnpm skips its supply-chain check of the lockfile when this file holds
      # a passing result for the same lockfile content and policy.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.pnpm_config_cache_dir }}/lockfile-verified.jsonl
          key: ${{ steps.pnpm-verdict.outputs.key }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Publish a preview for every public package via globs rather than a
      # hardcoded list. This keeps preview installs self-consistent: when
      # `emdash`'s preview references a sibling like @emdash-cms/registry-client
      # via `workspace:*`, pkg.pr.new can only rewrite that to a matching
      # preview URL if the sibling is published in the same run. Omitting one
      # makes the dep fall back to npm's released version, which breaks when the
      # source has drifted (e.g. a new exports subpath added without a release).
      # pkg.pr.new skips `private: true` packages automatically, so the test
      # fixtures under packages/plugins/* are excluded without enumerating them.
      - run: pnpm exec pkg-pr-new publish --pnpm './packages/*' './packages/plugins/*'
