name: Sync Skills

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      APP_ID:
        required: true
        description: GitHub App client ID for emdashbot.
      APP_PRIVATE_KEY:
        required: true
        description: GitHub App private key for emdashbot.

permissions:
  contents: read

jobs:
  sync:
    name: Sync skills to emdash-cms/skills
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job-level: when called from release.yml, github.workflow is the caller's
    # name, so a workflow-level group would collide with the caller's.
    concurrency:
      group: sync-skills-repo
      # Cancelling a run could interrupt a push to emdash-cms/skills.
      cancel-in-progress: false
    steps:
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: skills
          owner: emdash-cms
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Sync skills
        run: node scripts/sync-skills-repo.mjs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
