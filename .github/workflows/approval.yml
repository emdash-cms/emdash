name: Approval

# Maintains the informational `Human Maintainer approval` check and the four mutually
# exclusive review/* labels from one calculation, so a label never disagrees
# with the check. Pure actions/github-script: no checkout, no secrets, no agent.
#
# Do not add a pull_request_review trigger: it would run the PR branch's copy of
# this workflow. Instead the reviewer re-applies the PR's review label from the
# review webhook (infra/flue-review/.flue/lib/review-state.ts), and the labeled
# event runs the default branch's copy. Label changes made here use GITHUB_TOKEN
# and do not trigger it again.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, labeled]
  push:
    # Re-evaluate every open PR when the rules or the Maintainers list change.
    branches: [main]
    paths:
      - ".github/workflows/approval.yml"
      - "GOVERNANCE.md"
  schedule:
    # Backstop sweep so the check and labels stay correct if an event was missed.
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  approval:
    name: Update human review status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
      pull-requests: write
    concurrency:
      group: approval-${{ github.event.pull_request.number || 'sweep' }}
      cancel-in-progress: false
    steps:
      - name: Update approval check and review labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const checkName = 'Human Maintainer approval';
            const detailsUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const stateNames = [
              'review/needs-review',
              'review/awaiting-author',
              'review/needs-rereview',
              'review/approved',
            ];

            const privilegedPaths = [
              /^GOVERNANCE\.md$/,
              /^MAINTAINING\.md$/,
              /^AI_POLICY\.md$/,
              /^CONTRIBUTING\.md$/,
              /^TRIAGE\.md$/,
              /^AGENTS\.md$/,
              /^SECURITY\.md$/,
              /^proposals\/(README|feature-plan-template|rfc-template)\.md$/,
              /^rfcs\/README\.md$/,
              /^\.github\/CODEOWNERS$/,
              /^\.github\/PULL_REQUEST_TEMPLATE(?:\.md|\/)/,
              /^\.github\/ISSUE_TEMPLATE\//,
              /^\.github\/DISCUSSION_TEMPLATE\//,
              /^\.github\/dependabot\.yml$/,
              /^\.github\/codeql-config\.yml$/,
              /^\.github\/zizmor\.yml$/,
              /^\.github\/workflows\//,
              /^\.github\/actions\//,
              /^\.github\/scripts\//,
              /^\.changeset\/config\.json$/,
              /^renovate\.json$/,
              /^pnpm-workspace\.yaml$/,
              /^apps\/release-action\//,
              /^apps\/release-service\//,
              /^apps\/release-verifier\//,
              /^infra\/flue-review\//,
            ];

            const proposalIndex = 'proposals/README.md';
            const proposalPath =
              /^proposals\/(?!(?:README|feature-plan-template|rfc-template)\.md$)[a-z0-9][a-z0-9-]*\.md$/;

            // A design pull request adds its row to the proposal index, which is otherwise a
            // governance file. Edits that only touch table rows don't need two approvals.
            const onlyChangesIndexRows = file =>
              typeof file.patch === 'string' &&
              file.patch
                .split('\n')
                .filter(line => /^[+-]/.test(line))
                .every(line => /^[+-]\|/.test(line));

            const isPrivileged = (file, isDesign) =>
              privilegedPaths.some(pattern => pattern.test(file.filename)) &&
              !(isDesign && file.filename === proposalIndex && onlyChangesIndexRows(file));

            const handles = text =>
              [...text.matchAll(/\(@([a-z\d-]+)\)/gi)].map(match => match[1].toLowerCase());

            const scalar = value =>
              value.replace(/\s+#.*$/, '').trim().replace(/^(['"])(.*)\1$/, '$2').trim();

            function parseProposal(path, text) {
              const frontMatter = text.match(/^---\r?\n([\s\S]*?)\r?\n---/)?.[1] || '';
              const field = name =>
                frontMatter.match(new RegExp(`^${name}:(.*(?:\\r?\\n[ \\t]+.*)*)`, 'm'))?.[1] || '';
              return {
                path,
                type: scalar(field('type')),
                authors: handles(field('authors')),
                sponsor: handles(field('sponsor'))[0] || null,
              };
            }

            async function readProposals(pr, files) {
              const changed = files.filter(file =>
                file.status !== 'removed' && proposalPath.test(file.filename)
              );
              const contents = await Promise.all(changed.map(file =>
                github.rest.repos.getContent({ owner, repo, path: file.filename, ref: pr.head.sha })
              ));
              return contents
                .map(({ data }, index) => ({ path: changed[index].filename, data }))
                .filter(({ data }) => !Array.isArray(data) && data.type === 'file')
                .map(({ path, data }) => parseProposal(path, Buffer.from(data.content, 'base64').toString('utf8')));
            }

            // Read from the default branch, so neither a PR nor its base branch can
            // change who counts as a Maintainer.
            let governanceFile;
            try {
              ({ data: governanceFile } = await github.rest.repos.getContent({
                owner,
                repo,
                path: 'GOVERNANCE.md',
              }));
            } catch (error) {
              if (error.status !== 404) throw error;
              core.notice('GOVERNANCE.md is not on the default branch, so no approval can be evaluated.');
              return;
            }
            if (Array.isArray(governanceFile) || governanceFile.type !== 'file') {
              core.setFailed('GOVERNANCE.md was not returned as a file.');
              return;
            }
            const governance = Buffer.from(governanceFile.content, 'base64').toString('utf8');
            const maintainerBlock = governance.match(
              /<!-- maintainers:start -->([\s\S]*?)<!-- maintainers:end -->/,
            )?.[1];
            const maintainers = new Set(
              [...(maintainerBlock || '').matchAll(/https:\/\/github\.com\/([a-z\d-]+)/gi)]
                .map(match => match[1].toLowerCase()),
            );
            if (maintainers.size === 0) {
              core.setFailed('GOVERNANCE.md does not contain a marked Maintainers list.');
              return;
            }
            const projectLead = governance
              .match(/<!-- project-lead:start -->([\s\S]*?)<!-- project-lead:end -->/)?.[1]
              ?.match(/https:\/\/github\.com\/([a-z\d-]+)/i)?.[1]
              ?.toLowerCase() || null;

            async function setReviewLabel(pr, desired) {
              const current = new Set((pr.labels || []).map(label => label.name));
              if (desired && !current.has(desired)) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: pr.number,
                  labels: [desired],
                });
              }
              for (const name of stateNames) {
                if (name === desired || !current.has(name)) continue;
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: pr.number,
                    name,
                  });
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
            }

            async function setApprovalStatus(pr, approved, title, summary) {
              const runs = await github.paginate(github.rest.checks.listForRef, {
                owner,
                repo,
                ref: pr.head.sha,
                check_name: checkName,
                filter: 'all',
                per_page: 100,
              });
              const checks = runs.filter(run => run.name === checkName);
              const check = checks[0];
              const output = { title, summary };
              const outcome = {
                status: 'completed',
                conclusion: approved ? 'success' : 'neutral',
                completed_at: new Date().toISOString(),
              };

              if (check) {
                await github.rest.checks.update({
                  owner,
                  repo,
                  check_run_id: check.id,
                  ...outcome,
                  details_url: detailsUrl,
                  output,
                });
              } else {
                await github.rest.checks.create({
                  owner,
                  repo,
                  name: checkName,
                  head_sha: pr.head.sha,
                  ...outcome,
                  details_url: detailsUrl,
                  output,
                });
              }
              for (const older of checks.slice(1)) {
                if (older.status === 'completed') continue;
                await github.rest.checks.update({
                  owner,
                  repo,
                  check_run_id: older.id,
                  ...outcome,
                  details_url: detailsUrl,
                  output,
                });
              }
            }

            const statusMarker = '<!-- approval-status -->';

            // The approval check is easy to miss among the other checks, so design and
            // privileged pull requests, which have more than one requirement, also get a
            // comment. It is edited in place rather than reposted.
            function statusCommentBody(summary, checklist) {
              return [
                statusMarker,
                '### Approval status',
                '',
                summary,
                ...(checklist ? ['', checklist] : []),
                '',
                'This comment updates as reviews arrive. See [MAINTAINING.md](https://github.com/emdash-cms/emdash/blob/main/MAINTAINING.md) and [the proposal process](https://github.com/emdash-cms/emdash/blob/main/proposals/README.md) for the rules.',
              ].join('\n');
            }

            // A null body removes the comment. Without create, only an existing comment is updated.
            async function syncStatusComment(pr, body, { create = true } = {}) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: pr.number,
                per_page: 100,
              });
              const existing = comments.find(comment =>
                comment.user?.login === 'github-actions[bot]' && comment.body?.includes(statusMarker)
              );
              if (body === null) {
                if (existing) await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
              } else if (!existing) {
                if (create) await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
              } else if (existing.body !== body) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              }
            }

            async function evaluate(pr) {
              if (pr.draft) {
                await setApprovalStatus(
                  pr,
                  false,
                  'Draft pull request',
                  'Maintainer review is not requested while this pull request is a draft.',
                );
                await setReviewLabel(pr, null);
                await syncStatusComment(
                  pr,
                  statusCommentBody('This pull request is a draft. Approval requirements are checked when it is ready for review.'),
                  { create: false },
                );
                core.info(`#${pr.number}: draft, no approval required yet`);
                return;
              }

              const [reviews, commits, files] = await Promise.all([
                github.paginate(github.rest.pulls.listReviews, {
                  owner,
                  repo,
                  pull_number: pr.number,
                  per_page: 100,
                }),
                github.paginate(github.rest.pulls.listCommits, {
                  owner,
                  repo,
                  pull_number: pr.number,
                  per_page: 100,
                }),
                github.paginate(github.rest.pulls.listFiles, {
                  owner,
                  repo,
                  pull_number: pr.number,
                  per_page: 100,
                }),
              ]);

              // A review covers the current revision when every later commit is a
              // merge commit that updates the branch.
              const commitIndex = new Map(commits.map((commit, index) => [commit.sha, index]));
              const coversCurrentRevision = review => {
                const reviewedIndex = commitIndex.get(review.commit_id);
                if (reviewedIndex === undefined) return false;
                return commits
                  .slice(reviewedIndex + 1)
                  .every(commit => (commit.parents || []).length > 1);
              };

              const maintainerReviews = reviews
                .filter(review =>
                  review.user &&
                  review.user.type !== 'Bot' &&
                  review.user.login !== pr.user.login &&
                  maintainers.has(review.user.login.toLowerCase()) &&
                  Number.isFinite(Date.parse(review.submitted_at || ''))
                )
                .toSorted((a, b) => Date.parse(a.submitted_at) - Date.parse(b.submitted_at));

              const latestDecisionByReviewer = new Map();
              let lastReview = null;
              for (const review of maintainerReviews) {
                if (['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(review.state)) {
                  latestDecisionByReviewer.set(review.user.login, review);
                }
                if (['APPROVED', 'CHANGES_REQUESTED', 'COMMENTED'].includes(review.state)) {
                  lastReview = review;
                }
              }
              const decisions = [...latestDecisionByReviewer.values()];
              const approvers = decisions
                .filter(review => review.state === 'APPROVED' && coversCurrentRevision(review))
                .map(review => review.user.login);
              const changeRequests = decisions.filter(review => review.state === 'CHANGES_REQUESTED');

              const isDesign =
                /^design:/i.test(pr.title || '') || (pr.body || '').includes('<!-- design-pr -->');
              const proposals = isDesign ? await readProposals(pr, files) : [];
              const rfcs = proposals.filter(proposal => proposal.type === 'rfc');
              const opener = pr.user.login.toLowerCase();
              const authors = new Set([opener, ...proposals.flatMap(proposal => proposal.authors)]);
              const approved = new Set(approvers.map(login => login.toLowerCase()));
              const hasApproved = login => login === opener || approved.has(login);
              const independentApprovers = [...approved].filter(login => !authors.has(login));

              const privileged = files.some(file => isPrivileged(file, isDesign));
              const required = privileged ? 2 : 1;
              const category = privileged ? 'governance or privileged supply-chain' : 'normal';
              const requirements = [];
              const requirement = (met, text) => requirements.push({ met, text });
              // Only people the pull request is waiting on are mentioned, so the comment
              // doesn't notify everyone it names.
              const handle = login => `\`@${login}\``;
              const approval = (role, login, action) => {
                if (login === opener) return `${role} ${handle(login)} opened this pull request.`;
                if (approved.has(login)) return `${role} ${handle(login)} has ${action}.`;
                return `${role} @${login} has not ${action}.`;
              };
              const mentions = logins => logins.map(handle).join(', ');

              requirement(
                independentApprovers.length >= required,
                `${required} human Maintainer approval${required === 1 ? '' : 's'} from someone other than the author (${category} change); found ${independentApprovers.length}${independentApprovers.length > 0 ? `: ${mentions(independentApprovers)}` : ''}.`,
              );
              for (const proposal of proposals) {
                if (!['rfc', 'feature-plan'].includes(proposal.type)) {
                  requirement(
                    false,
                    `\`${proposal.path}\` must set \`type\` to \`rfc\` or \`feature-plan\`; found ${proposal.type ? `\`${proposal.type}\`` : 'none'}.`,
                  );
                }
              }
              if (rfcs.length > 0) {
                for (const sponsor of new Set(rfcs.map(rfc => rfc.sponsor))) {
                  if (!sponsor || !maintainers.has(sponsor)) {
                    requirement(false, `The RFC sponsor must be a Maintainer; found ${sponsor ? handle(sponsor) : 'none'}.`);
                  } else {
                    requirement(
                      hasApproved(sponsor),
                      approval('The RFC sponsor', sponsor, 'approved the current revision'),
                    );
                  }
                }
                const supporters = independentApprovers.filter(login => login !== projectLead);
                requirement(
                  supporters.length > 0,
                  `Support from a Maintainer other than the author and the Project Lead${supporters.length > 0 ? `: ${mentions(supporters)}` : ''}.`,
                );
                if (!projectLead) {
                  requirement(false, 'GOVERNANCE.md does not contain a marked Project Lead.');
                } else {
                  requirement(
                    hasApproved(projectLead),
                    approval('The Project Lead', projectLead, 'accepted the RFC'),
                  );
                }
              }
              const requesters = changeRequests.map(review => review.user.login);
              requirement(
                requesters.length === 0,
                requesters.length === 0
                  ? 'No outstanding change requests.'
                  : `Changes are still requested by ${mentions(requesters)}.`,
              );
              const met = requirements.every(item => item.met);
              const checklist = requirements
                .map(item => `- ${item.met ? '✅' : '❌'} ${item.text}`)
                .join('\n');

              let label;
              if (met) {
                label = 'review/approved';
              } else if (!lastReview) {
                label = 'review/needs-review';
              } else if (
                !coversCurrentRevision(lastReview) ||
                changeRequests.some(review => !coversCurrentRevision(review))
              ) {
                label = 'review/needs-rereview';
              } else if (changeRequests.length > 0 || lastReview.state === 'COMMENTED') {
                label = 'review/awaiting-author';
              } else {
                label = 'review/needs-review';
              }

              let title;
              if (met) title = 'Human Maintainer approval requirement met';
              else if (requesters.length > 0) title = 'Changes requested by a human Maintainer';
              else title = 'Awaiting human Maintainer approval';
              await setApprovalStatus(pr, met, title, checklist);
              await syncStatusComment(
                pr,
                isDesign || privileged
                  ? statusCommentBody(
                      met
                        ? 'The current revision meets the approval requirements.'
                        : 'The current revision does not meet the approval requirements yet.',
                      checklist,
                    )
                  : null,
              );

              // Bot-authored PRs have a review status check but carry no review label. This
              // also removes the label the reviewer adds to re-run the workflow.
              await setReviewLabel(pr, pr.user.type === 'Bot' ? null : label);
              core.info(`#${pr.number}: ${label}${met ? '' : ', approval pending'}`);
            }

            if (context.payload.pull_request) {
              await evaluate(context.payload.pull_request);
              return;
            }

            const prs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            core.info(`Sweeping ${prs.length} open PR(s)`);
            let failures = 0;
            for (const pr of prs) {
              try {
                await evaluate(pr);
              } catch (error) {
                failures += 1;
                core.warning(`#${pr.number}: failed to update approval state: ${error.message}`);
              }
            }
            if (failures > 0) core.setFailed(`${failures} PR(s) could not be updated.`);
