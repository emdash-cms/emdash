name: Proposal Discussions

# Keeps the Ideas Discussions linked from a proposal's front matter in step
# with it: a comment when a design PR opens, a comment when the proposal is
# accepted on main, and a comment and close when it is implemented.
# Only the base branch's script is checked out. PR content is read through the
# API as data.

on:
  pull_request_target:
    types: [opened, reopened]
    paths:
      - "proposals/**"
  push:
    branches: [main]
    paths:
      - "proposals/**"

permissions:
  contents: read

jobs:
  design-pr:
    name: Link design PR
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      discussions: write # comment on linked Discussions
      pull-requests: read # read the PR and its proposal files
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Comment on linked Ideas Discussions
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/scripts/proposal-discussions.mjs design-pr --pr "$PR_NUMBER"

  status:
    name: Announce proposal status
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      discussions: write # comment on and close linked Discussions
      pull-requests: read # find the merged PR for the commit
    concurrency:
      group: proposal-discussions-status
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Comment on and close linked Ideas Discussions
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: node .github/scripts/proposal-discussions.mjs push --before "$BEFORE" --after "$AFTER"
